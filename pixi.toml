[workspace]
authors = ["coda <dakotajayroth@gmail.com>"]
channels = ["conda-forge"]
name = "OER_tutor"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
dev = "uvicorn backend.main:app --reload --host 0.0.0.0 --port 8000"

[dependencies]
python = "3.13.*"
fastapi = ">=0.121.3,<0.122"
pydantic = ">=2.12.4,<3"
pydantic-settings = ">=2.12.0,<3"
pymongo = ">=4.15.4,<5"
pyjwt = ">=2.10.1,<3"
boto3 = ">=1.41.0,<2"
openai = ">=2.8.1,<3"

[pypi-dependencies]
langfuse = ">=3.10.1, <4"
prometheus-fastapi-instrumentator = ">=7.1.0, <8"
mangum = ">=0.19.0, <0.20"
sse-starlette = ">=3.0.3, <4"

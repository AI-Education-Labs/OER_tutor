name: Build and Deploy FastAPI to AWS Lambda For Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.LAMBDA_DEPLOY_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.LAMBDA_DEPLOY_SECRET_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: 471112753848.dkr.ecr.us-west-2.amazonaws.com
          ECR_REPOSITORY: fastapibackenddev0da7a51f/fastapifunction14c1518arepo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:prod
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:prod
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to AWS Lambda
        uses: appleboy/lambda-action@v0.2.0
        with:
          aws_access_key_id: ${{ secrets.LAMBDA_DEPLOY_ACCESS_KEY }}
          aws_secret_access_key: ${{ secrets.LAMBDA_DEPLOY_SECRET_KEY }}
          aws_region: us-west-2
          function_name: oer-tutor-prod-FastApiFunction-xaGdwn4ASasl
          image_uri: ${{ env.IMAGE_URI }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PDF Viewer Application">
    <title>PDF Viewer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="top-bar">
        <button id="prev-page" class="nav-button">Previous</button>
        <button id="next-page" class="nav-button">Next</button>
        <span id="page-info" class="page-info">Page: <span id="page-num"></span> of <span id="page-num"></span>
    </div>

    <canvas id="pdf-render"></canvas>
    <script src="https://mozilla.github.io/pdf.js/build/pdf.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
